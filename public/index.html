<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi Ardi · Taxi Dispatch Automation</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo-sm">🚕</span><div><b>Taxi Ardi</b><small>Taxi dispatch automation · Prishtina · Obiliq · Fushë Kosovë</small></div></div>
  <div class="sim">
    <span class="clock" id="clock">08:15</span>
    <button class="btn sm ghost ops-only" id="reset">↺ Reset</button>
    <span class="who"><span id="who"></span><button class="btn sm ghost" id="logout">Sign out</button></span>
  </div>
</header>
<main class="layout">
  <section class="devices">
    <div class="dev-tabs" id="dev-tabs">
      <button data-dev="customer" class="on">📱 Customer app</button>
      <button data-dev="ivr">☎️ Phone / IVR</button>
      <button data-dev="driver">🚗 Driver app</button>
    </div>
    <div class="device" id="dev-customer"><div class="notch"></div><div class="screen" id="cust"></div></div>
    <div class="device" id="dev-ivr" style="display:none"><div class="notch"></div><div class="screen" id="ivr"></div></div>
    <div class="device" id="dev-driver" style="display:none"><div class="notch"></div><div class="screen" id="drv"></div></div>
    <p class="hint" id="dev-hint"></p>
  </section>
  <section id="ops">
    <div id="sos-banner" style="display:none"></div>
    <div class="kpis" id="kpis"></div>
    <div class="ops-body">
      <div class="ops-left">
        <div class="map-wrap">
          <div id="ops-map"></div>
          <div class="map-tools"><label class="chk"><input type="checkbox" id="ops-heat" checked> Traffic</label><label class="chk"><input type="checkbox" id="ops-labels" checked> Labels</label><button class="btn sm" id="ops-fit" title="Zoom to the whole service area">⤢ Fit all</button><span id="pick-hint" class="pick-hint"></span></div>
          <div class="legend"><span><i style="background:#22c55e"></i>Available</span><span><i style="background:#f59e0b"></i>Offered</span><span><i style="background:#6366f1"></i>To pickup</span><span><i style="background:#a855f7"></i>At pickup</span><span><i style="background:#0ea5e9"></i>On trip</span><span><i class="pin"></i>Waiting rider</span></div>
          <div id="voip-modal" style="display:none"></div>
        </div>
        <div id="ops-detail" class="detail" style="display:none"></div>
      </div>
      <aside class="ops-side"><nav class="tabs" id="ops-tabs"></nav><div id="ops-pane"></div></aside>
    </div>
  </section>
</main>
<div id="login" class="login" style="display:none">
  <div id="lg-toast"></div>
  <div class="login-card">
    <div class="logo">🚕</div><h2>Taxi Ardi</h2><p>Sign in to open your workspace</p>
    <div class="lg-tabs" id="lg-tabs"><button type="button" data-r="client" class="on">📱 Client</button><button type="button" data-r="driver">🚗 Driver</button><button type="button" data-r="ops">🎧 Ops room</button><button type="button" data-r="superuser">🛡️ Superuser</button></div>
    <div id="lg-client">
      <form id="lg-f1" autocomplete="off">
        <label>Phone number<input id="lg-phone" type="tel" placeholder="+383 44 000 000"></label>
        <div class="err" id="lg-perr"></div>
        <button class="btn primary" type="submit">Send code</button>
        <small>We'll text you a 6-digit code to confirm it's you.</small>
      </form>
      <form id="lg-f2" autocomplete="off" style="display:none">
        <p class="sentto">We sent a 6-digit code to <b id="lg-sentto"></b></p>
        <input id="lg-otp" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;letter-spacing:.4em;font-size:22px">
        <div class="err" id="lg-oerr"></div>
        <button class="btn primary" type="submit">Verify and sign in</button>
        <a href="#" id="lg-back">Use a different number</a>
      </form>
    </div>
    <form id="login-form" autocomplete="off" style="display:none">
      <label>Username<input id="lg-user" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <label>Password<input id="lg-pass" type="password" placeholder="password"></label>
      <div class="err" id="lg-err"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="js/roads.js"></script>
<script src="js/city.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/net.js"></script>
<script src="js/rtc.js"></script>
<script src="js/map.js"></script>
<script src="js/main.js"></script>
<script src="js/customer.js"></script>
<script src="js/driver.js"></script>
<script src="js/ivr.js"></script>
<script src="js/ops.js"></script>
<script>RO.start();</script>
</body>
</html>
